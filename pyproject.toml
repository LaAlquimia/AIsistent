[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aisistent"
version = "0.2.0"
description = "MCP server for non-intrusive RDP automation. Cross-platform OCR, YOLO detection & click injection."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

authors = [
  {name = "LaAlquimia"},
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]

dependencies = [
  "mcp>=1.0",
  "Pillow>=10.0",
  "pyautogui>=0.9",
  "torch>=2.0",
  "ultralytics>=8.0",
]

[project.optional-dependencies]
apple = [
  "pyobjc-framework-Vision",
  "pyobjc-framework-Quartz",
  "pyobjc-framework-Cocoa",
]
cpu = [
  "easyocr>=1.7",
  "mss>=9.0",
  "opencv-python-headless>=4.8",
]
cuda = [
  "easyocr>=1.7",
  "mss>=9.0",
  "opencv-python-headless>=4.8",
]
rdp = [
  "simple-rdp>=0.8",
]
all = [
  "pyobjc-framework-Vision",
  "pyobjc-framework-Quartz",
  "pyobjc-framework-Cocoa",
  "easyocr>=1.7",
  "mss>=9.0",
  "opencv-python-headless>=4.8",
  "simple-rdp>=0.8",
]

[project.urls]
Homepage = "https://github.com/LaAlquimia/AIsistent"
Repository = "https://github.com/LaAlquimia/AIsistent"

[project.scripts]
aisistent = "aisistent.__main__:main"
aisistent-bench = "aisistent.benchmark:main"

[tool.setuptools.packages.find]
include = ["aisistent*"]
